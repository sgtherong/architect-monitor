name: Verify YouTube API connection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the eight designated videos without publishing secrets
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          key=os.environ.get('YOUTUBE_API_KEY','')
          if not key: raise SystemExit('YOUTUBE_API_KEY secret is missing')
          ids='7Qs3MWJbHHQ,hVmOUD0DmT8,oQn1XXS_Fmc,wKD2bxDzGhM,T78eBrhqu-0,6IQaqST2Ygc,gVFwMSk54vA,G36iQinLR0I'
          try:
              req=urllib.request.Request('https://www.googleapis.com/youtube/v3/videos?part=statistics&id='+ids,headers={'X-Goog-Api-Key':key})
              with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          except urllib.error.HTTPError as e:
              raise SystemExit('YouTube API validation failed: HTTP '+str(e.code))
          if {v['id'] for v in data.get('items',[])}!=set(ids.split(',')):
              raise SystemExit('Not all eight designated videos were returned')
          print('Validated all eight designated videos. No key, raw comments, or paid calls were published.')
          PY
