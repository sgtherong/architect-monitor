name: Verify YouTube API connection
on:
  push:
    branches: [main]
    paths: ['.github/workflows/youtube-key-connection.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate key and seal for the private collector
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/collector-public.pem <<'PUBLIC'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAwOTZlW7QMOM8Ks9KrgIz
          0AaauoDkS9KkZuIVyqIwkNmOEsh5heSGJHr6ubQ9lwCQKmcSAFSvUiN1yQ/xcYg2
          RQT8N/ugkfGDRpZPtRgzxJts+mbtqW0GdGLNSovqbh8nco+qkMXUtNty9jANHtuP
          MqHSEY+TT8Qp4cRB7yOA2388bOxDjptivYZQ8YiBOrep8UGwoQv7MjJ8QKT6Txfh
          siNJcMxLKkR1PkC2c6CKcm02FxIQLpDQUmvXCVvlzg14bEB7E3Z5liN8xMC88+3q
          61AER4ZdSl8wCuFZkG3HeMBvxNGTMwz36P8RXJb2oh1ru9rmmyMsia0wY8EbBQNb
          WmFt/6+bqwbXejmvftpyhHyuEIk5nkmevJQat9GxblX2hA7z3En2M1PNJgcU0x4R
          2ke6aYkLauEEJrQlHaiARTORre7gSlHs1frQufRybe59eZeril17IyyoaMQHyaGV
          +vp5v8yVfQSGEDK837jsQCN32V+/WNOtHDL2E2zjZzk3AgMBAAE=
          -----END PUBLIC KEY-----
          PUBLIC
          python - <<'PY'
          import os, json, urllib.request, urllib.error, subprocess
          key=os.environ.get('YOUTUBE_API_KEY','')
          if not key: raise SystemExit('YOUTUBE_API_KEY secret is missing')
          ids='7Qs3MWJbHHQ,hVmOUD0DmT8,oQn1XXS_Fmc,wKD2bxDzGhM,T78eBrhqu-0,6IQaqST2Ygc,gVFwMSk54vA,G36iQinLR0I'
          url='https://www.googleapis.com/youtube/v3/videos?part=statistics&id='+ids
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'X-Goog-Api-Key':key}),timeout=30) as r:
                  data=json.load(r)
          except urllib.error.HTTPError as e:
              raise SystemExit('YouTube API validation failed (HTTP '+str(e.code)+'); check API enablement and key restrictions')
          if {v['id'] for v in data.get('items',[])}!=set(ids.split(',')):
              raise SystemExit('Validation did not return all eight designated videos')
          subprocess.run(['openssl','pkeyutl','-encrypt','-pubin','-inkey','/tmp/collector-public.pem','-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256','-out','youtube-key.sealed'],input=key.encode(),check=True)
          print('Validated 8 designated videos. No paid API used. Secret sealed for private collector setup.')
          PY
      - name: Retain encrypted handoff for one day
        uses: actions/upload-artifact@v4
        with:
          name: youtube-key-connection
          path: youtube-key.sealed
          retention-days: 1
          if-no-files-found: error
